
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0b0b">
    <title>You're offline · Ki-Khobor</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0b0b0b;
        color: #f1eee7;
        font-family: Arial, sans-serif;
      }
      main { width: 100%; max-width: 420px; }
      .brand {
        font-size: 11px;
        letter-spacing: .18em;
        color: #aaa69e;
      }
      h1 { margin-top: 36px; font-size: 32px; font-weight: 500; }
      p { color: #aaa69e; line-height: 1.7; font-size: 14px; }
      button {
        margin-top: 20px;
        padding: 13px 19px;
        border: 1px solid #555;
        border-radius: 999px;
        background: transparent;
        color: white;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">KI-KHOBOR × HORNBILL</div>
      <h1>You're offline.</h1>
      <p>
        Your connection is unavailable. Previously loaded festival
        content may still be available. Reconnect to access pages
        that haven't been saved on this device.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
